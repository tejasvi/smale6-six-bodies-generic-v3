name = "CC6Full"
path = ".."

[[require]]
name = "lean6special"
path = "../../sections6-9"

[[lean_lib]]
name = "CC6Compose"
weakLeanArgs = ["-j4"]

[[require]]
name = "Lean6"
path = "../../sections3-5"
